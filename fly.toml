# 도그푸딩 서버(ADR-0042). 올리는 법은 README의 "Fly.io에 올리기".
app = "omagari-dogfood"
primary_region = "nrt" # 도쿄

[env]
# 받을 GitHub 계정 목록(ADR-0043). Pancheble/omagari는 레포가 하나이던 판의 레포라 켤 때마다 넣고, 그 판의 DB를 이 레포로 옮긴다.
OMAGARI_REPO = "Pancheble/omagari"
OMAGARI_URL = "https://omagari-dogfood.fly.dev"

# SQLite가 사는 디스크. 날마다 스냅샷이 백업이다.
[mounts]
source = "omagari_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off" # 러너의 WebSocket이 늘 붙어 있어야 한다
min_machines_running = 1

[[http_service.checks]]
method = "GET"
path = "/api/health"
interval = "15s"
timeout = "5s"
grace_period = "20s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
