# Fly.io 서버(도그푸딩 서버, ADR-0042).
# `app`(Fly 앱 이름)은 일부러 적지 않았다. 올리는 사람이 .env의 FLY_APP으로 준다: `fly deploy -a "$FLY_APP"`. 올리는 법은 README의 "Fly.io에 올리기".
primary_region = "nrt" # 도쿄

[env]
# 받을 GitHub 계정 목록(OMAGARI_REPO)도 적지 않는다. 배포할 때 `-e OMAGARI_REPO=...`로 준다(.env.example). 주소(OMAGARI_URL)는 Fly에서는 https://<앱 이름>.fly.dev로 서버가 정한다.
# 여기에는 누가 올려도 같은 값만 둔다.

# SQLite가 사는 디스크. 날마다 스냅샷이 백업이다.
[mounts]
source = "omagari_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off" # 러너의 WebSocket이 늘 붙어 있어야 한다
min_machines_running = 1

[[http_service.checks]]
method = "GET"
path = "/api/health"
interval = "15s"
timeout = "5s"
grace_period = "20s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
