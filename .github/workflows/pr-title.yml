name: PR title check
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  pull-requests: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            perf
          requireScope: false
          subjectPattern: ^.{0,49}[^.]$
          subjectPatternError: |
            The summary "{subject}" must be 50 characters or fewer and must not end with a period.
