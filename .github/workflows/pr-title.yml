name: PR 제목 검사
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  pull-requests: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            perf
          requireScope: false
          subjectPattern: ^.{0,49}[^.]$
          subjectPatternError: |
            요약 "{subject}"은 50자 안쪽이어야 하고, 끝에 마침표가 없어야 해요.
