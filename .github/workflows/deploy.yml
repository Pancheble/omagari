name: Deploy
# dev의 CI가 통과하면 도그푸딩 서버를 Fly.io에 올린다(ADR-0042).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    # CI가 push로 돌아 통과했을 때만. PR의 CI는 배포하지 않는다.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # FLY_API_TOKEN은 dev에서만 쓸 수 있는 Environment의 비밀값이다(레포 전체 비밀값이 아니다).
    environment: dogfood
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 올릴지 정한다
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN이 없어 배포를 건너뛴다"
            exit 0
          fi
          # 옛 CI 실행을 다시 돌려도 서버가 예전 판으로 돌아가지 않게, CI가 돈 커밋이 dev의 끝일 때만 올린다.
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" --jq .sha)
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "CI가 돈 커밋 $HEAD_SHA이 dev의 끝($tip)이 아니라 배포를 건너뛴다"
            exit 0
          fi
          echo "DEPLOY=1" >> "$GITHUB_ENV"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/checkout@v7
        if: env.DEPLOY == '1'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.DEPLOY == '1'
      - run: flyctl deploy --remote-only
        if: env.DEPLOY == '1'
