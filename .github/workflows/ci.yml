name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 포맷과 린트
        run: npm run format:check
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트
        run: npm test
