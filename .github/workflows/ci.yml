name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 포맷과 린트
        run: npm run format:check
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트
        run: npm test
      # npm 패키지를 빌드해 임시 prefix에 설치하고, 설치된 것이 도는지 본다(ADR-0048, publish.yml이 같은 빌드를 올린다).
      - name: npm 패키지
        run: |
          node scripts/build-package.ts 0.0.0-ci next
          out=$(mktemp -d)
          npm pack ./dist/omagari --pack-destination "$out"
          npm install -g --prefix "$out/prefix" "$out/omagari-0.0.0-ci.tgz"
          "$out/prefix/bin/omagari" --version | tee /dev/stderr | grep -q "^omagari 0.0.0-ci "
          "$out/prefix/bin/omagari" --help
          echo "{\"hook_event_name\":\"SessionStart\",\"cwd\":\"$PWD\",\"session_id\":\"ci\",\"source\":\"startup\"}" \
            | "$out/prefix/bin/omagari-hook" claude-code
