name: 실제 샌드박스 점검
# 버튼으로만 돈다(ADR-0038). PR과 push에는 돌지 않는다. 테스트에서 샌드박스를 가짜로 두는 결정(ADR-0033)은 그대로다.
# 돌리는 법과 읽는 법: docs/sandbox-check.md
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 도구 깔기
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - name: AppArmor의 비특권 사용자 네임스페이스 막기 풀기
        if: matrix.os == 'ubuntu-24.04'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - name: 점검
        run: |
          code=0
          node test/real-sandbox.ts > result.md || code=$?
          { echo "## ${{ matrix.os }}"; cat result.md; } >> "$GITHUB_STEP_SUMMARY"
          cat result.md
          exit $code
  wsl2:
    name: Windows 위의 WSL2(Ubuntu 24.04)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: bubblewrap socat ripgrep curl ca-certificates git
      # 레포는 WSL2 안의 홈에 복사해 돌린다. /mnt 아래에서 돌리면 Windows 드라이브 가리기와 겹쳐 점검이 흐려진다(ADR-0038).
      - name: Node 24 깔고 레포 복사
        shell: wsl-bash {0}
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          cp -a . ~/omagari
      - name: npm ci
        shell: wsl-bash {0}
        run: cd ~/omagari && npm ci
      - name: 점검
        shell: wsl-bash {0}
        run: |
          cd ~/omagari
          code=0
          node test/real-sandbox.ts > result.md || code=$?
          cat result.md
          cp result.md "$OLDPWD/result.md"
          exit $code
      - name: 실행 요약에 결과 싣기
        if: always()
        shell: bash
        run: |
          [ -f result.md ] || echo "결과 파일이 없다. 점검 전에 멈췄다." > result.md
          { echo "## Windows 위의 WSL2(Ubuntu 24.04)"; cat result.md; } >> "$GITHUB_STEP_SUMMARY"
