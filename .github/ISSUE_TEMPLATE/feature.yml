name: Feature request
description: Suggest a feature or an improvement you'd like to see
title: "[Feature] "
labels: ["type:feat"]
body:
  - type: textarea
    id: what-to-build
    attributes:
      label: What should we build?
      description: Describe the problem you want to solve and what you'd like to see.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you need it?
      description: Tell us how you handle this today and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: List checkable conditions that show this feature is finished.
      value: |
        - [ ]
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: If you considered other approaches, describe them.
    validations:
      required: false
