name: 기능 요청
description: 새로 있었으면 하는 기능이나 개선을 제안해 주세요
title: "[기능] "
labels: ["type:feat"]
body:
  - type: textarea
    id: what-to-build
    attributes:
      label: 무엇을 만들까요?
      description: 어떤 문제를 풀려는지와 원하는 모습을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요?
      description: 지금 어떻게 하고 있는지, 무엇이 불편한지 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 이 기능이 됐다고 볼 수 있는 확인 가능한 조건을 적어 주세요.
      value: |
        - [ ]
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 다른 방법
      description: 생각해 본 다른 방법이 있으면 적어 주세요.
    validations:
      required: false
