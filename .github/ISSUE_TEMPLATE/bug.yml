name: Bug report
description: Tell us about something that doesn't work the way you expected
title: "[Bug] "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security vulnerability, don't use this form. Report it privately, as described in [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what actually happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps in order so someone else can see the same result.
      placeholder: |
        1. Run `omagari runner`
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, commit or release tag, and agent (Claude Code, Codex)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach relevant logs or screenshots if you have them. Remove personal information and secret values.
    validations:
      required: false
